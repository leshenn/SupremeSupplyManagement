name: Deploy Supreme Supply

on:
  push:
    branches:
      - main

concurrency:
  group: supreme-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
      CMS_REVALIDATE_SECONDS: ${{ vars.CMS_REVALIDATE_SECONDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Next.js
        working-directory: Frontend
        run: npm run build

      - name: Verify build
        working-directory: Frontend
        run: |
          test -f .next/BUILD_ID
          test -d .next/static

          echo "Build ID:"
          cat .next/BUILD_ID

          echo "CSS:"
          find .next/static/css -type f

      - name: Package build
        working-directory: Frontend
        run: tar -czf next-build.tar.gz .next

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/supreme_deploy
          chmod 600 ~/.ssh/supreme_deploy

          ssh-keyscan \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload production build
        run: |
          scp \
            -i ~/.ssh/supreme_deploy \
            -P "${{ secrets.CPANEL_PORT }}" \
            Frontend/next-build.tar.gz \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/sjiolccb/supreme-next-build.tar.gz"

      - name: Deploy on cPanel
        run: |
          ssh \
            -i ~/.ssh/supreme_deploy \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            'bash -s' <<'EOF'

          set -e

          REPO="/home/sjiolccb/repositories/SupremeSupplyManagement"
          APP="$REPO/Frontend"
          ARCHIVE="/home/sjiolccb/supreme-next-build.tar.gz"
          STAGE="/home/sjiolccb/supreme-deploy-stage"
          PROCESS_PATTERN="lsnode:/home/sjiolccb/repositories/SupremeSupplyManagement/Frontend/"

          echo "Updating source code..."
          cd "$REPO"

          git fetch origin main
          git reset --hard "${{ github.sha }}"

          echo "Activating Node environment..."
          source /home/sjiolccb/nodevenv/repositories/SupremeSupplyManagement/Frontend/22/bin/activate

          echo "Installing production dependencies..."
          cd "$APP"
          npm install --omit=dev

          echo "Preparing new build..."
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          tar -xzf "$ARCHIVE" -C "$STAGE"

          echo "Checking new build..."
          test -f "$STAGE/.next/BUILD_ID"

          echo "New build ID:"
          cat "$STAGE/.next/BUILD_ID"

          echo "Stopping CloudLinux Node application..."

          cloudlinux-selector stop \
            --json \
            --interpreter nodejs \
            --app-root repositories/SupremeSupplyManagement/Frontend \
            || true

          sleep 2

          echo "Checking for surviving Passenger process..."

          PIDS=$(pgrep -f "$PROCESS_PATTERN" || true)

          if [ -n "$PIDS" ]; then
            echo "Old Passenger process still running: $PIDS"
            echo "Stopping it..."

            kill $PIDS || true
            sleep 3
          fi

          PIDS=$(pgrep -f "$PROCESS_PATTERN" || true)

          if [ -n "$PIDS" ]; then
            echo "Process still alive. Force killing: $PIDS"

            kill -9 $PIDS || true
            sleep 2
          fi

          PIDS=$(pgrep -f "$PROCESS_PATTERN" || true)

          if [ -n "$PIDS" ]; then
            echo "ERROR: Could not stop old Passenger process."
            exit 1
          fi

          echo "Old Passenger process is gone."

          echo "Replacing production .next..."

          rm -rf "$APP/.next.old"

          if [ -d "$APP/.next" ]; then
            mv "$APP/.next" "$APP/.next.old"
          fi

          mv "$STAGE/.next" "$APP/.next"

          echo "Clearing runtime caches..."

          rm -rf "$APP/.next/server/route-cache"

          rm -rf "$STAGE"
          rm -f "$ARCHIVE"

          echo "Verifying deployed build..."

          test -f "$APP/.next/BUILD_ID"

          echo "Deployed build ID:"
          cat "$APP/.next/BUILD_ID"

          echo "Starting CloudLinux Node application..."

          cloudlinux-selector start \
            --json \
            --interpreter nodejs \
            --app-root repositories/SupremeSupplyManagement/Frontend

          echo "Waiting for application to start..."
          sleep 5

          echo "Current Passenger process:"
          pgrep -af "$PROCESS_PATTERN" || true

          echo "Deployment complete."
          EOF

      - name: Verify new build is live
        run: |
          BUILD_ID=$(ssh \
            -i ~/.ssh/supreme_deploy \
            -p "${{ secrets.CPANEL_PORT }}" \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "cat /home/sjiolccb/repositories/SupremeSupplyManagement/Frontend/.next/BUILD_ID")

          echo "Expected build ID: $BUILD_ID"

          for attempt in {1..12}; do
            echo "Checking live site - attempt $attempt..."

            HTML=$(curl -fsS \
              -H "Cache-Control: no-cache" \
              "https://supremesupply.co.za/?deploy-check=${BUILD_ID}-${attempt}-$(date +%s)" \
              || true)

            if printf '%s' "$HTML" | grep -q "$BUILD_ID"; then
              echo "Correct build is live."

              CSS=$(printf '%s' "$HTML" \
                | grep -o '/_next/static/css/[^"]*' \
                | head -1)

              echo "Live CSS: $CSS"

              if [ -z "$CSS" ]; then
                echo "ERROR: No CSS file found."
                exit 1
              fi

              curl -fsSI "https://supremesupply.co.za$CSS"

              echo "Removing backup build..."

              ssh \
                -i ~/.ssh/supreme_deploy \
                -p "${{ secrets.CPANEL_PORT }}" \
                "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
                "rm -rf /home/sjiolccb/repositories/SupremeSupplyManagement/Frontend/.next.old"

              echo "Deployment verified successfully."
              exit 0
            fi

            echo "New build not live yet. Waiting 5 seconds..."
            sleep 5
          done

          echo "ERROR: New build exists on cPanel but is not being served."
          exit 1