kind = "web"
previewPath = "/"
title = "Supreme Supply Management"
description = "A premium, responsive company website for Supreme Supply Management, presenting its logistics services, global network, project experience, and quote contact details."
version = "1.0.0"
id = "artifacts/supreme-supply"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23582

[services.development]
run = "pnpm --filter @workspace/supreme-supply run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/supreme-supply", "run", "build" ]
serve = "static"
publicDir = "artifacts/supreme-supply/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23582"
BASE_PATH = "/"
